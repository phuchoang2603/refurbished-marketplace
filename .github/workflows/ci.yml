name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  lint:
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: devenv tasks run repo:lint

  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            users:
              - 'services/users/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/auth/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/testutil/postgres/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            products:
              - 'services/products/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/kafka/**'
              - 'shared/testutil/postgres/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            search:
              - 'services/search/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/kafka/**'
              - 'shared/testutil/meilisearch/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            inventory:
              - 'services/inventory/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/postgres/**'
              - 'shared/testutil/kafka/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            orders:
              - 'services/orders/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/postgres/**'
              - 'shared/testutil/kafka/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            checkout:
              - 'services/checkout/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/observe/metric/**'
              - 'shared/testutil/postgres/**'
              - 'shared/testutil/redis/**'
              - 'shared/testutil/kafka/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            cart:
              - 'services/cart/**'
              - 'shared/proto/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/testutil/redis/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'
            web:
              - 'services/web/**'
              - 'shared/proto/**'
              - 'shared/auth/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
              - 'scripts/check.sh'
              - 'devenv.*'

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: bash scripts/check.sh ${{ matrix.service }}

  govulncheck:
    if: github.event_name == 'schedule'
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: bash scripts/vulncheck.sh
