name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 0000 UTC — full govulncheck scan (path filters skipped)
    - cron: "0 0 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  GO_CACHE_DEPENDENCY_PATH: |
    go.work
    **/go.sum
  GO_MODULE_GLOBS: >-
    ./services/users/...
    ./services/products/...
    ./services/search/...
    ./services/inventory/...
    ./services/orders/...
    ./services/cart/...
    ./services/payment/...
    ./services/web/...
    ./shared/auth/...
    ./shared/err/dberr/...
    ./shared/err/grpcerr/...
    ./shared/messaging/...
    ./shared/observe/metric/...
    ./shared/observe/log/...
    ./shared/observe/trace/...
    ./shared/proto/...
    ./shared/runtime/...
    ./shared/testutil/postgres/...
    ./shared/testutil/kafka/...
    ./shared/testutil/meilisearch/...
    ./shared/testutil/mongo/...
    ./shared/testutil/redis/...
    ./tools/payment-gateway-simulator/...

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          go_version: ${{ env.GO_VERSION }}
          golangci_lint_version: v2.12.2
          golangci_lint_flags: --config=.golangci.yml ${{ env.GO_MODULE_GLOBS }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          filter_mode: diff_context
          fail_level: error

  changes:
    runs-on: ubuntu-latest
    outputs:
      users: ${{ steps.filter.outputs.users }}
      products: ${{ steps.filter.outputs.products }}
      search: ${{ steps.filter.outputs.search }}
      inventory: ${{ steps.filter.outputs.inventory }}
      orders: ${{ steps.filter.outputs.orders }}
      payment: ${{ steps.filter.outputs.payment }}
      cart: ${{ steps.filter.outputs.cart }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            users:
              - 'services/users/**'
              - 'shared/proto/**'
              - 'shared/auth/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/testutil/postgres/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            products:
              - 'services/products/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/kafka/**'
              - 'shared/testutil/mongo/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            search:
              - 'services/search/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/kafka/**'
              - 'shared/testutil/meilisearch/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            inventory:
              - 'services/inventory/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/postgres/**'
              - 'shared/testutil/kafka/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            orders:
              - 'services/orders/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/postgres/**'
              - 'shared/testutil/kafka/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            payment:
              - 'services/payment/**'
              - 'shared/proto/**'
              - 'shared/messaging/**'
              - 'shared/err/dberr/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'shared/testutil/postgres/**'
              - 'shared/testutil/kafka/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            cart:
              - 'services/cart/**'
              - 'shared/proto/**'
              - 'shared/err/grpcerr/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/testutil/redis/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            web:
              - 'services/web/**'
              - 'shared/proto/**'
              - 'shared/auth/**'
              - 'shared/runtime/**'
              - 'shared/observe/log/**'
              - 'shared/observe/trace/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - users
          - products
          - search
          - inventory
          - orders
          - payment
          - cart
          - web
    steps:
      - name: Skip when path filter does not match
        if: needs.changes.outputs[matrix.service] != 'true'
        run: echo "Skipping tests for ${{ matrix.service }}"

      - uses: actions/checkout@v6
        if: needs.changes.outputs[matrix.service] == 'true'

      - uses: actions/setup-go@v6
        if: needs.changes.outputs[matrix.service] == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Test ${{ matrix.service }}
        if: needs.changes.outputs[matrix.service] == 'true'
        run: go test ./services/${{ matrix.service }}/...

  govulncheck:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - users
          - products
          - search
          - inventory
          - orders
          - payment
          - cart
          - web
    steps:
      - name: Skip when path filter does not match
        if: github.event_name != 'schedule' && needs.changes.outputs[matrix.service] != 'true'
        run: echo "Skipping govulncheck for ${{ matrix.service }}"

      - uses: actions/checkout@v6
        if: github.event_name == 'schedule' || needs.changes.outputs[matrix.service] == 'true'

      - uses: actions/setup-go@v6
        if: github.event_name == 'schedule' || needs.changes.outputs[matrix.service] == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Run govulncheck
        if: github.event_name == 'schedule' || needs.changes.outputs[matrix.service] == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -C "services/${{ matrix.service }}" -format sarif ./... > govulncheck.sarif

      - name: Upload SARIF file
        if: github.event_name == 'schedule' || needs.changes.outputs[matrix.service] == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck-${{ matrix.service }}
