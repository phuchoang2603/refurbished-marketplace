name: Release Images

on:
  push:
    branches: [main]
    paths:
      - infra/docker/**
      - services/**
      - shared/**
      - go.work
      - go.work.sum
      - "**/go.mod"
      - .github/workflows/release-images.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - infra/docker/**
      - services/**
      - shared/**
      - go.work
      - go.work.sum
      - "**/go.mod"
      - .github/workflows/release-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: infra/docker/web.Dockerfile
            build_args: ""
          - image: users
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/users/cmd/users
              BUILD_BIN=users
              EXPOSE_PORT=9091
          - image: products
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/products/cmd/products
              BUILD_BIN=products
              EXPOSE_PORT=9092
          - image: search
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/search/cmd/search
              BUILD_BIN=search
              EXPOSE_PORT=9098
          - image: inventory
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/inventory/cmd/inventory
              BUILD_BIN=inventory
              EXPOSE_PORT=9097
          - image: orders
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/orders/cmd/orders
              BUILD_BIN=orders
              EXPOSE_PORT=9093
          - image: checkout
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/checkout/cmd/checkout
              BUILD_BIN=checkout
              EXPOSE_PORT=9099
          - image: cart
            dockerfile: infra/docker/go-service.Dockerfile
            build_args: |
              BUILD_PKG=./services/cart/cmd/cart
              BUILD_BIN=cart
              EXPOSE_PORT=9094
          - image: connect-debezium
            dockerfile: infra/docker/connect-debezium.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v6

      - id: publish
        name: Decide whether to publish
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          image="${{ matrix.image }}"
          base="ghcr.io/${repo}/${image}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tags="${base}:pr-${{ github.event.number }}-${{ github.sha }}"
          else
            tags="${base}:main-${{ github.sha }}
          ${base}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          provenance: false
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}

  pin:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Pin chart image tags after a successful build
        env:
          TAG: main-${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${head_sha}" != "${SHA}" ]; then
            echo "main moved to ${head_sha}; skipping stale pin for ${SHA}"
            exit 0
          fi
          changed=0
          for file in \
            infra/charts/refurbished-marketplace/values-prod.yaml \
            infra/charts/kafka/values-prod.yaml; do
            tmp="${file}.tmp"
            awk -v tag="${TAG}" '
              /^global:/ { in_global = 1 }
              in_global && /^[[:space:]]*imageTag:/ { sub(/imageTag:.*/, "imageTag: " tag); in_global = 0 }
              { print }
            ' "${file}" > "${tmp}"
            if cmp -s "${file}" "${tmp}"; then
              rm "${tmp}"
            else
              mv "${tmp}" "${file}"
              changed=1
            fi
          done
          if [ "${changed}" -eq 0 ]; then
            echo "image tags already pinned to ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): pin images to ${SHA:0:7} [skip ci]"
          git push origin HEAD:main
