name: Cleanup PR GHCR images

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR-only package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.number }}
        run: |
          python3 <<'PY'
          import json, os, subprocess, urllib.parse

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          pr = os.environ["PR"]
          images = [
              "web", "users", "users-migrator", "products", "search",
              "inventory", "inventory-migrator",
              "orders", "orders-migrator", "checkout", "checkout-migrator",
              "cart", "connect-debezium",
          ]

          def gh(*args):
              return subprocess.run(
                  ["gh", "api", *args],
                  check=False,
                  capture_output=True,
                  text=True,
              )

          def paginate(path):
              items = []
              page = 1
              while True:
                  listed = gh(f"{path}?per_page=100&page={page}")
                  if listed.returncode != 0 or not listed.stdout.strip():
                      break
                  try:
                      chunk = json.loads(listed.stdout)
                  except json.JSONDecodeError:
                      break
                  if isinstance(chunk, dict):
                      chunk = [chunk]
                  if not chunk:
                      break
                  items.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              return items

          prefix = f"pr-{pr}-"

          for image in images:
              pkg = urllib.parse.quote(f"{repo}/{image}", safe="")
              list_path = f"/users/{owner}/packages/container/{pkg}/versions"
              for version in paginate(list_path):
                  tags = (
                      (version.get("metadata") or {})
                      .get("container", {})
                      .get("tags")
                      or []
                  )
                  if not tags or not all(t.startswith(prefix) for t in tags):
                      continue
                  vid = version["id"]
                  print(f"deleting {repo}/{image} version {vid} tags={tags}")
                  deleted = gh("-X", "DELETE", f"{list_path}/{vid}")
                  if deleted.returncode != 0:
                      print(deleted.stderr)
                      raise SystemExit(deleted.returncode)
          PY
