syntax = "proto3";

package checkout.v1;

option go_package = "github.com/phuchoang2603/refurbished-marketplace/shared/proto/checkout/v1;checkoutv1";

message CheckoutMessage {
  MessageContext context = 1;
  reserved 2, 5, 10 to 17;
  reserved "create_order", "reserve_stock";
  oneof payload {
    PrepareCheckout prepare_checkout = 22;
    OrderCreated order_created = 3;
    OrderRejected order_rejected = 4;
    StockReserved stock_reserved = 6;
    StockRejected stock_rejected = 7;
    CancelStock cancel_stock = 8;
    StockReleased stock_released = 9;
    CommitStock commit_stock = 18;
    StockCommitted stock_committed = 19;
    FinalizeOrder finalize_order = 20;
    OrderFinalized order_finalized = 21;
  }
}

message MessageContext {
  string message_id = 1;
  string checkout_id = 2;
  string operation_id = 3;
  string causation_id = 4;
  string order_id = 5;
  uint64 workflow_version = 6;
}

message CheckoutLine {
  string product_id = 1;
  string name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
  string category = 5;
  string condition = 6;
}

message CheckoutAddress {
  string name = 1;
  string line1 = 2;
  string line2 = 3;
  string city = 4;
  string region = 5;
  string postal_code = 6;
  string country = 7;
}

message PrepareCheckout {
  string buyer_user_id = 1;
  string merchant_id = 2;
  int64 total_cents = 3;
  string currency = 4;
  repeated CheckoutLine items = 5;
}

message OrderCreated {}

message OrderRejected {
  string reason = 1;
}

message StockReserved {}

message StockRejected {
  string reason = 1;
}

message CancelStock {
  string reason = 1;
}

message StockReleased {}

message CommitStock {}

message StockCommitted {}

message FinalizeOrder {
  FinalOrderStatus status = 1;
}

message OrderFinalized {
  FinalOrderStatus status = 1;
}

enum FinalOrderStatus {
  FINAL_ORDER_STATUS_UNSPECIFIED = 0;
  FINAL_ORDER_STATUS_PAID = 1;
  FINAL_ORDER_STATUS_FAILED = 2;
}
