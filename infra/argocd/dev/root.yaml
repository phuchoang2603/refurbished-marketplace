# Apply to dev's own Argo CD after talos-proxmox platform bring-up, using the kubeconfig from
# Doppler talos-proxmox/dev. Apply infra/k8s/doppler-token.dev.secret.yaml and infra/argocd/project.yaml first.
# Images: GHCR :<git-sha> ($ARGOCD_APP_REVISION).
# Git pointer is spec.source.targetRevision in this file. Required SHA-tagged images must exist before sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: refurbished-marketplace
  source:
    repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
    targetRevision: main
    path: infra/argocd/app-of-apps
    helm:
      values: |
        namePrefix: dev
        global:
          imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
          imagePullPolicy: Always
        marketplace:
          enabled: true
      parameters:
        - name: targetRevision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        - name: global.imageTag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
