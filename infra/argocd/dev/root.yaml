# Apply only on talos-dev. Do not apply prod-root here.
# Secrets: kubectl apply -f infra/k8s/doppler-token.dev.secret.yaml
# Images: GHCR :<git-sha> ($ARGOCD_APP_REVISION).
# Git pointer is spec.source.targetRevision in this file. Change it here, commit, apply.
# Before merging this change to main, set targetRevision back to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
    targetRevision: openspec/replace-istio-with-cilium
    path: infra/argocd/app-of-apps
    helm:
      values: |
        namePrefix: dev
        global:
          imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
          imagePullPolicy: Always
        marketplace:
          enabled: true
      parameters:
        - name: targetRevision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        - name: global.imageTag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
