# Apply only on talos-dev. Do not apply prod-root here.
# Secrets: kubectl apply -f infra/k8s/doppler-token.dev.secret.yaml
# Set spec.source.targetRevision to main or a branch. Images use that commit SHA
# ($ARGOCD_APP_REVISION) — wait for GHCR :<sha> before pods will pull.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
    targetRevision: main
    path: infra/argocd/app-of-apps
    helm:
      values: |
        namePrefix: dev
        global:
          imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
        marketplace:
          enabled: true
      parameters:
        - name: targetRevision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        - name: global.imageTag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
