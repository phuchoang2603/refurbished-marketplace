# Apply on the gpu cluster (Argo CD). Workloads land on the registered `dev` cluster.
# Secrets on talos-dev: kubectl --kubeconfig=$HOME/.kube/talos-dev.yaml apply -f infra/k8s/doppler-token.dev.secret.yaml
# Images: GHCR :<git-sha> ($ARGOCD_APP_REVISION).
# Git pointer is spec.source.targetRevision in this file. Change it here, commit, apply.
# Leave this on the live feature branch until we deliberately retarget (do not flip to main on merge).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
    targetRevision: openspec/replace-istio-with-cilium
    path: infra/argocd/app-of-apps
    helm:
      values: |
        namePrefix: dev
        destinationName: dev
        global:
          imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
          imagePullPolicy: Always
        marketplace:
          enabled: true
      parameters:
        - name: targetRevision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        - name: global.imageTag
          value: $ARGOCD_APP_REVISION
  destination:
    # Application CRs stay on gpu (where Argo CD runs).
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
