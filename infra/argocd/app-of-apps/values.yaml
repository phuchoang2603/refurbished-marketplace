repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
targetRevision: main
namePrefix: dev

syncRetry:
  limit: -1
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 5m

global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTags:
    ghcr.io/phuchoang2603/refurbished-marketplace/web: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/users: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/products: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/search: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/inventory: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/orders: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/checkout: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/cart: dev
    ghcr.io/phuchoang2603/refurbished-marketplace/connect-debezium: dev
  imagePullPolicy: Always

namespaces:
  - ecommerce

marketplace:
  enabled: true
  valueFiles: []

apps:
  meilisearch:
    syncWave: "2"
    path: infra/charts/meilisearch
    releaseName: catalog-meilisearch
    namespace: ecommerce
    valueFiles:
      - values-dev.yaml
  kafka:
    syncWave: "4"
    path: infra/charts/kafka
    releaseName: ecommerce-kafka-cluster
    namespace: ecommerce
    injectGlobalImages: true
