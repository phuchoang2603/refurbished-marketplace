# Marketplace Application catalog. talos-proxmox platform roots must install shared operators,
# CRDs, storage, and observability before this root syncs. The marketplace root creates
# the ecommerce SecretStore after the bootstrap token Secret is present.
# Env lives in:
# - dest cluster: ecommerce/doppler-token (Doppler dev vs prd)
# - infra/argocd/{dev,prod}/root.yaml: namePrefix, destinationName, git revision, imageTag
# Chart values.yaml is the Talos-dev shape. Do not add Doppler config names here.
# Argo CD runs on the management cluster; destinationName is the registered Argo cluster (dev / prod).
repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
targetRevision: main
namePrefix: dev
destinationName: dev

global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main
  imagePullPolicy: Always

marketplace:
  enabled: true
  valueFiles: []

apps:
  mongodb:
    syncWave: "2"
    path: infra/charts/mongodb
    releaseName: catalog-mongodb
    namespace: ecommerce
  meilisearch:
    syncWave: "2"
    path: infra/charts/meilisearch
    releaseName: catalog-meilisearch
    namespace: ecommerce
  kafka:
    syncWave: "4"
    path: infra/charts/kafka
    releaseName: ecommerce-kafka-cluster
    namespace: kafka
    injectGlobalImages: true
