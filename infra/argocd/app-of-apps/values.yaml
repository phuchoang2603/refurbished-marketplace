# Marketplace Application catalog, rendered by the root on each environment's own Argo CD.
# Children target the local cluster and consume talos-proxmox platform operators and CRDs;
# retries absorb platform components that are still converging.
# Env lives in:
# - local cluster: ecommerce/doppler-token (Doppler dev vs prd)
# - infra/argocd/{dev,prod}/root.yaml: namePrefix, git revision, imageTag
# Chart values.yaml is the Talos-dev shape. Do not add Doppler config names here.
repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
targetRevision: main
namePrefix: dev

syncRetry:
  limit: -1
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 5m

global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main
  imagePullPolicy: Always

# The root is the only owner of these namespaces and their Istio ambient enrollment;
# child Applications target them but never create or relabel them.
namespaces:
  - ecommerce
  - kafka

marketplace:
  enabled: true
  valueFiles: []

apps:
  secret-store:
    syncWave: "1"
    path: infra/charts/secret-store
    releaseName: ecommerce-secret-store
    namespace: ecommerce
  mongodb:
    syncWave: "2"
    path: infra/charts/mongodb
    releaseName: catalog-mongodb
    namespace: ecommerce
  meilisearch:
    syncWave: "2"
    path: infra/charts/meilisearch
    releaseName: catalog-meilisearch
    namespace: ecommerce
  kafka:
    syncWave: "4"
    path: infra/charts/kafka
    releaseName: ecommerce-kafka-cluster
    namespace: kafka
    injectGlobalImages: true
