# Shared Application catalog. Env lives in:
# - dest cluster: operators/doppler-token (Doppler dev vs prd)
# - infra/argocd/{dev,prod}/root.yaml: namePrefix, destinationName, git revision, imageTag
# Chart values.yaml is the Talos-dev shape. Do not add Doppler config names here.
# Argo CD runs on the gpu cluster; destinationName is the registered Argo cluster (dev / prod).
repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
targetRevision: main
namePrefix: dev
destinationName: dev

global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main
  imagePullPolicy: Always

marketplace:
  enabled: true
  valueFiles: []

apps:
  external-secrets:
    syncWave: "0"
    path: infra/charts/operators/external-secrets
    releaseName: external-secrets
    namespace: operators
  cnpg:
    syncWave: "0"
    path: infra/charts/operators/cnpg
    releaseName: cnpg
    namespace: operators
  strimzi:
    syncWave: "0"
    path: infra/charts/operators/strimzi
    releaseName: strimzi-cluster-operator
    namespace: operators
  observability:
    syncWave: "1"
    path: infra/charts/observability
    releaseName: observability
    namespace: monitoring
    valueFiles: []
    ignoreDifferences: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  kafka:
    syncWave: "4"
    path: infra/charts/kafka
    releaseName: ecommerce-kafka-cluster
    namespace: kafka
    injectGlobalImages: true
  cloudflare-tunnel:
    syncWave: "5"
    path: infra/charts/cloudflare-tunnel
    releaseName: cloudflare-tunnel
    namespace: cloudflare-tunnel
