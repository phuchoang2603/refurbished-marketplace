# Apply to prod's own Argo CD after talos-proxmox platform bring-up, using the kubeconfig from
# Doppler talos-proxmox/prod. Apply infra/k8s/doppler-token.prd.secret.yaml and infra/argocd/project.yaml first.
# Images: GHCR at the verified feature-branch SHA. Hosts/Kafka/tunnel: chart values-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: refurbished-marketplace
  source:
    repoURL: https://github.com/phuchoang2603/refurbished-marketplace.git
    # TEMP: verification of integrate-payment-gateway-checkout; revert to main before merge.
    targetRevision: feat/integrate-payment-gateway-checkout
    path: infra/argocd/app-of-apps
    helm:
      values: |
        namePrefix: prod
        global:
          imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
          imageTag: 239d02868f971669560212823e691f830123546f
          imagePullPolicy: Always
        marketplace:
          enabled: true
          valueFiles:
            - values-prod.yaml
        apps:
          kafka:
            valueFiles:
              - values-prod.yaml
          mongodb:
            valueFiles:
              - values-prod.yaml
          meilisearch:
            valueFiles:
              - values-prod.yaml
      parameters:
        - name: targetRevision
          value: feat/integrate-payment-gateway-checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
