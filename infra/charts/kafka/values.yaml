global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTags:
    ghcr.io/phuchoang2603/refurbished-marketplace/connect-debezium: dev
  clusterName: dev-talos
  environment: dev

kafka:
  clusterName: ecommerce-kafka-cluster
  version: 4.3.1
  metadataVersion: 4.3-IV0
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage:
    size: 5Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 1Gi

entityOperator:
  topicOperator:
    jvmOptions:
      "-Xms": 256m
      "-Xmx": 256m
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 512Mi

connect:
  clusterName: ecommerce-connect-cluster
  image: connect-debezium
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 180
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 12
entities:
  users:
    topics:
      - name: users.account-created.v1
        partitions: 1
        retention: -1
        cleanupPolicy: compact
    connector:
      name: users-outbox
      sourceSecretName: users-app
      databaseName: users_db
      databaseHost: users-db-rw
      databasePort: 5432
      outboxTable: public.users_outbox
      publicationAutocreateMode: filtered
      snapshotMode: initial
  products:
    topics:
      - name: products.created
        partitions: 1
        retention: -1
    connector:
      name: products-postgres-outbox
      sourceSecretName: products-app
      databaseHost: products-db-rw
      databasePort: 5432
      databaseName: products_db
      outboxTable: public.products_outbox
      publicationAutocreateMode: filtered
      snapshotMode: initial
  checkout:
    topics:
      - name: checkout.prepare.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-cancel.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-commit.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.order-finalize.requested.v1
        partitions: 1
        retention: 86400000
    connector:
      name: checkout-outbox
      sourceSecretName: checkout-app
      databaseName: checkout_db
      databaseHost: checkout-db-rw
      databasePort: 5432
      outboxTable: public.checkout_outbox
      publicationAutocreateMode: filtered
  orders:
    topics:
      - name: checkout.order-created.v1
        partitions: 1
        retention: 86400000
      - name: checkout.order-rejected.v1
        partitions: 1
        retention: 86400000
      - name: checkout.order-finalized.v1
        partitions: 1
        retention: 86400000
    connector:
      name: orders-outbox
      sourceSecretName: orders-app
      databaseName: orders_db
      databaseHost: orders-db-rw
      databasePort: 5432
      outboxTable: public.orders_outbox
      publicationAutocreateMode: filtered
  inventory:
    topics:
      - name: checkout.stock-reserved.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-rejected.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-released.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-committed.v1
        partitions: 1
        retention: 86400000
    connector:
      name: inventory-outbox
      sourceSecretName: inventory-app
      databaseName: inventory_db
      databaseHost: inventory-db-rw
      databasePort: 5432
      outboxTable: public.inventory_outbox
      publicationAutocreateMode: filtered
