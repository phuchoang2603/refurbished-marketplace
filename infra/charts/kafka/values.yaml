global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main

# Namespace that hosts marketplace CNPG databases and app secrets
# (orders-app, payment-app, products-app). Kafka itself deploys to Release.Namespace.
appNamespace: ecommerce

kafka:
  clusterName: ecommerce-kafka-cluster
  version: 4.2.0
  metadataVersion: 4.2-IV1
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage:
    size: 5Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Topic/user operators previously ran BestEffort (no requests) and got
# starved on busy nodes — health probes never bound and Kafka stayed NotReady.
entityOperator:
  topicOperator:
    jvmOptions:
      "-Xms": 256m
      "-Xmx": 256m
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 512Mi
  userOperator:
    jvmOptions:
      "-Xms": 256m
      "-Xmx": 256m
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 512Mi

connect:
  clusterName: ecommerce-connect-cluster
  image: connect-debezium
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  # spec.tracing (Strimzi OTEL java agent) adds ~200Mi of non-heap overhead
  # (agent + metaspace + direct buffers); 512Mi limit caused repeated OOMKills.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 180
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 12
entities:
  orders:
    topics:
      - name: orders.created
        partitions: 1
        retention: 86400000 # 1 day
    connector:
      name: orders-outbox
      sourceSecretName: orders-app
      databaseName: orders_db
      databaseHost: orders-db-rw
      databasePort: 5432
      outboxTable: public.orders_outbox
      publicationAutocreateMode: filtered
  payment:
    topics:
      - name: payment.succeeded
        partitions: 1
        retention: 86400000
      - name: payment.failed
        partitions: 1
        retention: 86400000
    connector:
      name: payment-outbox
      sourceSecretName: payment-app
      databaseName: payment_db
      databaseHost: payment-db-rw
      databasePort: 5432
      outboxTable: public.payment_outbox
      publicationAutocreateMode: filtered
  inventory:
    topics:
      - name: inventory.reserved
        partitions: 1
        retention: 86400000
      - name: inventory.reservation-failed
        partitions: 1
        retention: 86400000
    connector:
      name: inventory-outbox
      sourceSecretName: products-app
      databaseName: products_db
      databaseHost: products-db-rw
      databasePort: 5432
      outboxTable: public.inventory_outbox
      publicationAutocreateMode: filtered
provectus:
  enabled: true
  name: kafka-ui
  image: provectuslabs/kafka-ui:v0.7.2
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
