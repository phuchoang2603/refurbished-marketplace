global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main

# Namespace that hosts marketplace CNPG databases and app secrets
# (orders-app, payment-app, inventory-app, mongodb-catalog-app). Kafka itself deploys to Release.Namespace.
appNamespace: ecommerce

kafka:
  clusterName: ecommerce-kafka-cluster
  version: 4.3.1
  metadataVersion: 4.3-IV0
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage:
    size: 5Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  # Brokers use ~150-200m steady (550m+ at startup); a nominal request hid that load from the scheduler.
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Topic/user operators previously ran BestEffort (no requests) and got
# starved on busy nodes — health probes never bound and Kafka stayed NotReady.
entityOperator:
  topicOperator:
    jvmOptions:
      "-Xms": 256m
      "-Xmx": 256m
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 512Mi

connect:
  clusterName: ecommerce-connect-cluster
  image: connect-debezium
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  # spec.tracing (Strimzi OTEL java agent) adds ~200Mi of non-heap overhead
  # (agent + metaspace + direct buffers); 512Mi limit caused repeated OOMKills.
  # CPU request covers plugin scanning at startup (~430m observed) without starving neighbours.
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 180
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 12
entities:
  products:
    topics:
      - name: products.created
        partitions: 1
        retention: -1 # Retain creation history for independent consumers and replay.
    connector:
      name: products-outbox
      kind: mongodb
      sourceSecretName: mongodb-catalog-app
      databaseHost: catalog-mongodb-svc
      databasePort: 27017
      databaseName: catalog
      authSource: catalog
      replicaSet: catalog-mongodb
      outboxCollection: catalog.catalog_outbox
  checkout:
    topics:
      - name: checkout.order-create.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-reserve.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-cancel.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-commit.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-session-create.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-session-cancel.requested.v1
        partitions: 1
        retention: 86400000
      - name: checkout.order-finalize.requested.v1
        partitions: 1
        retention: 86400000
    connector:
      name: checkout-outbox
      sourceSecretName: checkout-app
      databaseName: checkout_db
      databaseHost: checkout-db-rw
      databasePort: 5432
      outboxTable: public.checkout_outbox
      publicationAutocreateMode: filtered
  orders:
    topics:
      - name: checkout.order-created.v1
        partitions: 1
        retention: 86400000
      - name: checkout.order-rejected.v1
        partitions: 1
        retention: 86400000
      - name: checkout.order-finalized.v1
        partitions: 1
        retention: 86400000
    connector:
      name: orders-outbox
      sourceSecretName: orders-app
      databaseName: orders_db
      databaseHost: orders-db-rw
      databasePort: 5432
      outboxTable: public.orders_outbox
      publicationAutocreateMode: filtered
  payment:
    topics:
      - name: checkout.payment-session-ready.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-session-rejected.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-cancelled.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-succeeded.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-failed.v1
        partitions: 1
        retention: 86400000
      - name: checkout.payment-uncertain.v1
        partitions: 1
        retention: 86400000
    connector:
      name: payment-outbox
      sourceSecretName: payment-app
      databaseName: payment_db
      databaseHost: payment-db-rw
      databasePort: 5432
      outboxTable: public.payment_outbox
      publicationAutocreateMode: filtered
  inventory:
    topics:
      - name: checkout.stock-reserved.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-rejected.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-released.v1
        partitions: 1
        retention: 86400000
      - name: checkout.stock-committed.v1
        partitions: 1
        retention: 86400000
    connector:
      name: inventory-outbox
      sourceSecretName: inventory-app
      databaseName: inventory_db
      databaseHost: inventory-db-rw
      databasePort: 5432
      outboxTable: public.inventory_outbox
      publicationAutocreateMode: filtered
