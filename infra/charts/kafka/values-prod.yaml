global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main-04b6b9d0860a2f3ff2f01775e2fc717a40e87c5b
  imagePullPolicy: Always

# Prod Kafka: single broker (RF 1) to save RAM, 7-day retention, six preparation partitions.
kafka:
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage:
    size: 10Gi

entities:
  checkout:
    topics:
      - { name: checkout.prepare.requested.v1, partitions: 6, retention: 604800000 }
      - { name: checkout.stock-cancel.requested.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.stock-commit.requested.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.order-finalize.requested.v1, partitions: 1, retention: 604800000 }
  orders:
    topics:
      - { name: checkout.order-created.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.order-rejected.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.order-finalized.v1, partitions: 1, retention: 604800000 }
  inventory:
    topics:
      - { name: checkout.stock-reserved.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.stock-rejected.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.stock-released.v1, partitions: 1, retention: 604800000 }
      - { name: checkout.stock-committed.v1, partitions: 1, retention: 604800000 }
