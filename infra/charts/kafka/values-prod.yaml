# Prod Kafka: single broker (RF 1) to save RAM, 7-day retention, more partitions.
kafka:
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage:
    size: 10Gi

entities:
  orders:
    topics:
      - name: orders.created
        partitions: 10
        retention: 604800000
  payment:
    topics:
      - name: payment.succeeded
        partitions: 6
        retention: 604800000
      - name: payment.failed
        partitions: 6
        retention: 604800000
  inventory:
    topics:
      - name: inventory.reserved
        partitions: 6
        retention: 604800000
      - name: inventory.reservation-failed
        partitions: 6
        retention: 604800000
