# Chart defaults = Talos-dev. Prod hosts: values-prod.yaml.
ingress:
  enabled: true
  name: grafana
  port: 80
  hostname: grafana-dev.phuchoang.sbs
  backendService: observability-grafana
  backendPort: 80

victoria-metrics-k8s-stack:
  fullnameOverride: vmks

  defaultDashboards:
    enabled: true

  # Upstream renders vmks-sync-job as a Helm hook, which Argo CD does not run.
  # The wrapper chart creates an equivalent PostSync Job instead.
  syncJob:
    createJob: false

  grafana:
    enabled: true
    grafana.ini:
      server:
        domain: grafana-dev.phuchoang.sbs
        root_url: https://grafana-dev.phuchoang.sbs
    plugins:
      - victoriametrics-logs-datasource
    persistence:
      enabled: true
    # TraceQL / Traces Drilldown and VictoriaLogs Explore are memory-heavy;
    # 512Mi OOMKilled (exit 137) on Logs Explore — give it headroom.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    progressDeadlineSeconds: 900

  # Upstream hardcodes /select/jaeger for defaultDatasources.victoriatraces and
  # does not tpl-expand extra URLs. Provide Tempo explicitly for TraceQL /
  # Traces Drilldown (matches fullnameOverride vmks + monitoring namespace).
  defaultDatasources:
    victorialogs:
      datasources:
        - name: VictoriaLogs (DS)
          access: proxy
          uid: VictoriaLogs
          type: victoriametrics-logs-datasource
          jsonData:
            # Grafana only treats lowercase level tokens as known. Map slog's
            # uppercase Level.String() values and common text tokens in _msg
            # (CNPG/Postgres, leftover Java lines).
            logLevelRules:
              - field: level
                operator: equals
                value: INFO
                level: info
                enabled: true
              - field: level
                operator: equals
                value: WARN
                level: warning
                enabled: true
              - field: level
                operator: equals
                value: WARNING
                level: warning
                enabled: true
              - field: level
                operator: equals
                value: ERROR
                level: error
                enabled: true
              - field: level
                operator: equals
                value: DEBUG
                level: debug
                enabled: true
              - field: _msg
                operator: regex
                value: "(?i)\\bERROR\\b"
                level: error
                enabled: true
              - field: _msg
                operator: regex
                # Envoy/Istio use tab-separated "warning" / "warn" / "info".
                value: "(?i)(?:\\t|\\s)(warn(?:ing)?)(?:\\t|\\s)"
                level: warning
                enabled: true
              - field: _msg
                operator: regex
                value: "(?i)(?:\\t|\\s)(info|log)(?:\\t|\\s)"
                level: info
                enabled: true
              - field: _msg
                operator: regex
                value: "(?i)(?:\\t|\\s)debug(?:\\t|\\s)"
                level: debug
                enabled: true
    victoriatraces:
      datasources: []
    extra:
      - name: VictoriaTraces
        type: tempo
        access: proxy
        uid: VictoriaTraces
        url: http://vtsingle-vmks.monitoring.svc.cluster.local:10428/select/tempo
        jsonData:
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            # TraceId-only: do not also filter by service.name→service, so
            # Trace → logs returns all marketplace JSON lines for the TraceId.
            filterByTraceID: true
            filterBySpanID: false

  victoria-metrics-operator:
    crds:
      cleanup:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  alertmanager:
    enabled: true

  vmalert:
    enabled: true

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: 7d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi

  vmcluster:
    enabled: false

  vlsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        resources:
          requests:
            storage: 20Gi

  vlcluster:
    enabled: false

  vmagent:
    enabled: true
    spec:
      # Pick up VMPodScrapes / VMServiceScrapes cluster-wide.
      selectAllByDefault: true
      podScrapeNamespaceSelector: {}
      podScrapeSelector: {}
      serviceScrapeNamespaceSelector: {}
      serviceScrapeSelector: {}
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

  vlagent:
    enabled: true
    spec:
      k8sCollector:
        enabled: true
        excludeFilter: "not kubernetes.pod_namespace:=ecommerce or kubernetes.container_name:=wait-for-db"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

  vtsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      extraArgs:
        otlpGRPCListenAddr: ":4317"
        otlpGRPC.tls: "false"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      serviceSpec:
        useAsDefault: true
        spec:
          ports:
            - name: http
              port: 10428
              targetPort: 10428
              protocol: TCP
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
      storage:
        resources:
          requests:
            storage: 10Gi

  vtcluster:
    enabled: false

  prometheus-node-exporter:
    enabled: true

  kube-state-metrics:
    enabled: true

dashboardSyncJob:
  enabled: true

customDashboards:
  enabled: true
  folder: Marketplace
