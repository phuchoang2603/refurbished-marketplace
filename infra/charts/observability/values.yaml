# Chart defaults = local Colima, apps-only signals:
# - metrics: Istio waypoint + ingress scrapes (ecommerce) → VMSingle
# - traces: VTSingle OTLP for marketplace services
# - logs: VLAgent filtered to ecommerce (+ kafka) → VLSingle
# No node-exporter, kube-state-metrics, Alertmanager, or default K8s dashboards.
# Staging overlays values-staging.yaml for full platform stack.
victoria-metrics-k8s-stack:
  fullnameOverride: vmks

  defaultDashboards:
    enabled: false

  # Upstream renders vmks-sync-job as a Helm hook, which Argo CD does not run.
  # The wrapper chart creates an equivalent PostSync Job instead.
  syncJob:
    createJob: false

  grafana:
    enabled: true
    plugins:
      - victoriametrics-logs-datasource
    persistence:
      enabled: false
    # Traces Drilldown / TraceQL UI is memory-heavy; 192Mi OOMKilled (exit 137)
    # on drilldown. Give it headroom.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Upstream hardcodes /select/jaeger for defaultDatasources.victoriatraces and
  # does not tpl-expand extra URLs. Provide Tempo explicitly for TraceQL /
  # Traces Drilldown (matches fullnameOverride vmks + monitoring namespace).
  defaultDatasources:
    victorialogs:
      datasources:
        - name: VictoriaLogs (DS)
          access: proxy
          uid: VictoriaLogs
          type: victoriametrics-logs-datasource
          jsonData:
            # Java / Strimzi lines lack a structured level field; map common
            # log4j tokens in _msg so Explore is not all "unknown".
            logLevelRules:
              - field: _msg
                operator: regex
                value: "(?i)\\bERROR\\b"
                level: error
                enabled: true
              - field: _msg
                operator: regex
                value: "(?i)\\bWARN(?:ING)?\\b"
                level: warning
                enabled: true
              - field: _msg
                operator: regex
                value: "(?i)\\bINFO\\b"
                level: info
                enabled: true
              - field: _msg
                operator: regex
                value: "(?i)\\bDEBUG\\b"
                level: debug
                enabled: true
    victoriatraces:
      datasources: []
    extra:
      - name: VictoriaTraces
        type: tempo
        access: proxy
        uid: VictoriaTraces
        url: http://vtsingle-vmks.monitoring.svc.cluster.local:10428/select/tempo
        jsonData:
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            # TraceId-only: do not also filter by service.name→service, so
            # Trace → logs returns all marketplace JSON lines for the TraceId.
            filterByTraceID: true
            filterBySpanID: false

  victoria-metrics-operator:
    crds:
      cleanup:
        enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  alertmanager:
    enabled: false

  # Needs Alertmanager; enable in values-staging.yaml.
  vmalert:
    enabled: false

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: 1d
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  vmcluster:
    enabled: false

  vlsingle:
    enabled: true
    spec:
      retentionPeriod: 1d
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      storage:
        resources:
          requests:
            storage: 1Gi

  vlcluster:
    enabled: false

  vmagent:
    enabled: true
    spec:
      # Pick up wrapper-owned Istio VMPodScrapes only (no node/ksm scrapes locally).
      selectAllByDefault: true
      podScrapeNamespaceSelector: {}
      podScrapeSelector: {}
      serviceScrapeNamespaceSelector: {}
      serviceScrapeSelector: {}
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  vlagent:
    enabled: true
    spec:
      k8sCollector:
        enabled: true
        # Marketplace apps + Kafka Connect/brokers; drop Strimzi entity-operator
        # reconcile spam that drowns Explore.
        excludeFilter: 'not kubernetes.pod_namespace:in(ecommerce, kafka) or kubernetes.pod_name:~"entity-operator"'
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  vtsingle:
    enabled: true
    spec:
      retentionPeriod: 1d
      # Direct OTLP ingest (no collector). HTTP remains on :10428;
      # gRPC enabled for app/Istio exporters.
      extraArgs:
        otlpGRPCListenAddr: ":4317"
        otlpGRPC.tls: "false"
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      serviceSpec:
        useAsDefault: true
        spec:
          ports:
            - name: http
              port: 10428
              targetPort: 10428
              protocol: TCP
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
      storage:
        resources:
          requests:
            storage: 1Gi

  vtcluster:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  kube-state-metrics:
    enabled: false

# Wrapper-owned dashboard/rules sync job for Argo CD PostSync.
dashboardSyncJob:
  enabled: false

# Repo-owned Grafana dashboards (ConfigMaps → Grafana sidecar).
# Independent of defaultDashboards / dashboardSyncJob so local Colima still
# gets Marketplace Istio RED without pulling upstream K8s dashboards.
customDashboards:
  enabled: true
  folder: Marketplace

# Scrape Istio L7 proxies only (waypoint + ingress). Control-plane scrapes omitted.
istioScrapes:
  enabled: true
  waypointName: ecommerce-waypoint
  waypointNamespaces:
    - ecommerce
  ingressName: ecommerce-ingress
  ingressNamespaces:
    - ecommerce
