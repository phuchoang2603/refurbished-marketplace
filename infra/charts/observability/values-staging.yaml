# Staging overlays resource/HA settings. Tempo Trace→logs (tracesToLogsV2)
# lives in values.yaml and is inherited unless overridden here.
victoria-metrics-k8s-stack:
  defaultDashboards:
    enabled: true

  grafana:
    persistence:
      enabled: true
    # First boot on PVC runs a long SQLite migration; default 600s deadline
    # marks the Deployment ProgressDeadlineExceeded and Argo Degraded.
    progressDeadlineSeconds: 900
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  victoria-metrics-operator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  alertmanager:
    enabled: true

  vmalert:
    enabled: true

  vmsingle:
    spec:
      retentionPeriod: 7d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        resources:
          requests:
            storage: 20Gi

  vlsingle:
    spec:
      retentionPeriod: 3d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        resources:
          requests:
            storage: 20Gi

  vmagent:
    spec:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

  vlagent:
    enabled: true
    spec:
      k8sCollector:
        enabled: true
        # Same as local: ecommerce apps + CNPG; exclude Envoy + wait-for-db.
        excludeFilter: "not kubernetes.pod_namespace:=ecommerce or kubernetes.container_name:in(istio-proxy, wait-for-db)"

  vtsingle:
    spec:
      retentionPeriod: 3d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        resources:
          requests:
            storage: 10Gi

  prometheus-node-exporter:
    enabled: true

  kube-state-metrics:
    enabled: true

dashboardSyncJob:
  enabled: true
