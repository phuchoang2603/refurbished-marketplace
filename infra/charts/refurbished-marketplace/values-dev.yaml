ingress:
  webHostname: shop.phuchoang.sbs

rollout:
  enabled: false

defaults:
  otel:
    metricExportInterval: "10000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi

services:
  web:
    replicas: 2
    env:
      PPROF_ENABLED: "true"
      PUBLIC_BASE_URL: https://shop.phuchoang.sbs
  search:
    env:
      PPROF_ENABLED: "true"
