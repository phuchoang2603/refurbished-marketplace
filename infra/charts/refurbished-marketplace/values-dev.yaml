ingress:
  webHostname: shop-dev.phuchoang.sbs

rollout:
  enabled: true

defaults:
  otel:
    metricExportInterval: "10000"

services:
  web:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi
    env:
      PUBLIC_BASE_URL: https://shop-dev.phuchoang.sbs
