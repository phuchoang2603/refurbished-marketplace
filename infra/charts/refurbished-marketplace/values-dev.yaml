ingress:
  webHostname: shop.phuchoang.sbs

rollout:
  enabled: true
  analysis:
    minimumRequests: 0

defaults:
  otel:
    metricExportInterval: "10000"
  resources:
    requests:
      cpu: 100m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 128Mi

mesh:
  waypoint:
    resources:
      limits:
        cpu: "1"

services:
  web:
    replicas: 2
    env:
      PPROF_ENABLED: "true"
      PUBLIC_BASE_URL: https://shop.phuchoang.sbs
  search:
    env:
      PPROF_ENABLED: "true"
