global:
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: 50c53f50e617b1a5619299741200ca4252db36a3
  imagePullPolicy: Always

# Prod overlay (Argo `prod-root` valueFiles). Doppler env is the cluster
# `ecommerce/doppler-token` Secret, not this file.
ingress:
  webHostname: shop.phuchoang.sbs

services:
  web:
    env:
      PUBLIC_BASE_URL: https://shop.phuchoang.sbs
  checkout:
    env:
      PAYMENT_GATEWAY_URL: http://edge.payment-gateway.svc.cluster.local:8080
      CHECKOUT_RETURN_BASE_URL: https://shop.phuchoang.sbs
    paymentGateway:
      secretName: checkout-payment-gateway
