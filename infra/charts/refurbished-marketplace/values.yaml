global:
  imagePullPolicy: IfNotPresent
  imageRegistry: ghcr.io/phuchoang2603/refurbished-marketplace
  imageTag: main

ingress:
  enabled: true
  name: ecommerce-ingress
  port: 80
  webHostname: shop-dev.phuchoang.sbs
  simulatorHostname: pay-dev.phuchoang.sbs
  # Publishes both hostnames through the platform's Cloudflare tunnel, which creates their DNS records.
  tunnel:
    enabled: true
    clusterTunnel: talos-proxmox
  # Web and simulator GETs only read, so transient backend failures retry within the total budget.
  reads:
    method: GET
    timeouts:
      request: 30s
      backendRequest: 9s
    retry:
      attempts: 2
      backoff: 100ms
      codes: [502, 503]
  # Everything else, including checkout, cart, hosted-payment, and callback POSTs, never retries.
  writes:
    timeouts:
      request: 30s
      backendRequest: 25s

# Istio ambient is platform-installed; the app-of-apps root enrolls this namespace.
mesh:
  waypoint:
    enabled: true
    name: waypoint
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # gRPC Services whose east-west traffic goes through the waypoint. Kafka, databases, and the
  # browser-facing HTTP Services stay on ztunnel only.
  resilience:
    services:
      - users
      - products
      - search
      - inventory
      - orders
      - checkout
      - cart
      - payment
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 256
        http1MaxPendingRequests: 64
    retryBudget:
      percent: 20
      minRetryConcurrency: 3
    # Rendered only for Services with more than one replica, so a sole endpoint is never ejected.
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    # Unary methods that are safe to replay; an identical SubmitCheckout returns the original
    # checkout. Istio retries connect failures, refused streams, and gRPC UNAVAILABLE/CANCELLED.
    # Every other method, including cart and payment mutations, is routed without retries.
    grpcRetries:
      timeouts:
        request: 10s
        backendRequest: 3s
      retry:
        attempts: 2
        backoff: 50ms
      methods:
        users:
          - users.v1.UsersService/GetUserByID
        products:
          - products.v1.ProductsService/GetProductByID
          - products.v1.ProductsService/GetProductsByIDs
        search:
          - search.v1.SearchService/SearchProducts
        inventory:
          - inventory.v1.InventoryService/GetStock
          - inventory.v1.InventoryService/GetStocksByIDs
        orders:
          - orders.v1.OrdersService/GetOrderByID
          - orders.v1.OrdersService/ListOrdersByBuyer
        checkout:
          - checkout.v1.CheckoutService/SubmitCheckout
          - checkout.v1.CheckoutService/GetCheckout
        cart:
          - cart.v1.CartService/GetCart
        payment:
          - payment.v1.PaymentService/GetHostedPaymentSessionByOrder

defaults:
  otel:
    # Node-local platform agent (internalTrafficPolicy: Local); http:// marks insecure gRPC.
    endpoint: http://otel-agent.observability.svc.cluster.local:4317
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  migrationResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  sidecarResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  dbResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: doppler

services:
  web:
    enabled: true
    image: web
    port: 8080
    protocol: http
    auth:
      secretName: users-auth
      secretKey: JWT_SECRET
    env:
      USERS_SVC_ADDR: users:9091
      PRODUCTS_SVC_ADDR: products:9092
      INVENTORY_SVC_ADDR: inventory:9097
      SEARCH_SVC_ADDR: search:9098
      ORDERS_SVC_ADDR: orders:9093
      CART_SVC_ADDR: cart:9094
      PAYMENT_SVC_ADDR: payment:9096
      CHECKOUT_SVC_ADDR: checkout:9099
      HOSTED_PAYMENT_BASE_URL: https://pay-dev.phuchoang.sbs
      PUBLIC_BASE_URL: https://shop-dev.phuchoang.sbs
      HOSTED_PAYMENT_CALLBACK_BASE_URL: http://web:8080

  users:
    enabled: true
    image: users
    port: 9091
    protocol: grpc
    auth:
      secretName: users-auth
      secretKey: JWT_SECRET
    migration:
      enabled: true
      image: users-migrator
    db:
      host: users-db-rw
      port: 5432
      name: users_db
      owner: users_app
      secretName: users-app
      usernameKey: username
      passwordKey: password
      instances: 1
      storageSize: 1Gi

  products:
    enabled: true
    image: products
    port: 9092
    protocol: grpc
    mongo:
      host: catalog-mongodb-svc
      port: 27017
      database: catalog
      user: catalog
      authSource: catalog
      replicaSet: catalog-mongodb
      secretName: mongodb-catalog-app
      passwordKey: password
    initResources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  search:
    enabled: true
    image: search
    port: 9098
    protocol: grpc
    env:
      KAFKA_BOOTSTRAP_SERVERS: ecommerce-kafka-cluster-kafka-bootstrap.kafka.svc:9092
    meili:
      host: catalog-meilisearch
      port: 7700
      secretName: meilisearch-master-key
      secretKey: MEILI_MASTER_KEY

  inventory:
    enabled: true
    image: inventory
    port: 9097
    protocol: grpc
    env:
      KAFKA_BOOTSTRAP_SERVERS: ecommerce-kafka-cluster-kafka-bootstrap.kafka.svc:9092
    migration:
      enabled: true
      image: inventory-migrator
    db:
      host: inventory-db-rw
      port: 5432
      name: inventory_db
      owner: inventory_app
      secretName: inventory-app
      usernameKey: username
      passwordKey: password
      instances: 1
      storageSize: 1Gi

  orders:
    enabled: true
    image: orders
    port: 9093
    protocol: grpc
    env:
      KAFKA_BOOTSTRAP_SERVERS: ecommerce-kafka-cluster-kafka-bootstrap.kafka.svc:9092
    migration:
      enabled: true
      image: orders-migrator
    db:
      host: orders-db-rw
      port: 5432
      name: orders_db
      owner: orders_app
      secretName: orders-app
      usernameKey: username
      passwordKey: password
      instances: 1
      storageSize: 1Gi

  checkout:
    enabled: true
    image: checkout
    port: 9099
    protocol: grpc
    auth:
      secretName: users-auth
      secretKey: JWT_SECRET
    env:
      KAFKA_BOOTSTRAP_SERVERS: ecommerce-kafka-cluster-kafka-bootstrap.kafka.svc:9092
    migration:
      enabled: true
      image: checkout-migrator
    db:
      host: checkout-db-rw
      port: 5432
      name: checkout_db
      owner: checkout_app
      secretName: checkout-app
      usernameKey: username
      passwordKey: password
      instances: 1
      storageSize: 1Gi

  cart:
    enabled: true
    image: cart
    port: 9094
    protocol: grpc
    env:
      REDIS_ADDR: 127.0.0.1:6379
    sidecars:
      - name: redis
        image: docker.io/valkey/valkey:7.2.5
        port: 6379

  payment:
    enabled: true
    image: payment
    port: 9096
    protocol: grpc
    env:
      KAFKA_BOOTSTRAP_SERVERS: ecommerce-kafka-cluster-kafka-bootstrap.kafka.svc:9092
    migration:
      enabled: true
      image: payment-migrator
    db:
      host: payment-db-rw
      port: 5432
      name: payment_db
      owner: payment_app
      secretName: payment-app
      usernameKey: username
      passwordKey: password
      instances: 1
      storageSize: 1Gi

  payment-gateway-simulator:
    enabled: true
    image: payment-gateway-simulator
    port: 8097
    protocol: http
