# Chart defaults: in-cluster Cloudflare Tunnel to Cilium Gateway origin.
replicaCount: 1

image:
  repository: cloudflare/cloudflared
  tag: "2026.5.0"
  pullPolicy: IfNotPresent

# Remotely managed tunnel: Public Hostnames are configured in Cloudflare Zero Trust.
# Point shop/pay (or shop-dev/pay-dev) Public Hostnames at:
#   http://cilium-gateway-ecommerce-ingress.ecommerce.svc.cluster.local:80
# Grafana (grafana-dev / grafana) Public Hostname at:
#   http://cilium-gateway-grafana.monitoring.svc.cluster.local:80
tunnel:
  existingSecret: cloudflare-tunnel-token
  existingSecretKey: token

externalSecrets:
  enabled: true
  refreshInterval: 1h
  remoteKey: CLOUDFLARE_TUNNEL_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
