schema: spec-driven

context: |
  Project: Refurbished Marketplace
  Domain: multi-service e-commerce marketplace

  Development Workflow:
  - devenv.nix manages local development tooling; if tools are missing, add them to devenv.nix and run `direnv reload`
  - Go multi-module workspace. Prefer the devenv `go:tidy` task (`devenv tasks run go:tidy`) for `go work sync`
  - Talos Kubernetes; dev and prod each run their own Argo CD in `argo-cd`, installed by the `talos-proxmox` platform OpenTofu root. The `talos-proxmox` `platform` root Application owns shared operators, CRDs, storage, the Cilium CNI, Istio ambient (istiod, CNI, ztunnel), the Doppler ClusterSecretStore, Cloudflare Tunnel, and observability. This repo's roots deploy marketplace, MongoDBCommunity, Meilisearch, and Kafka consumers to the local cluster (`https://kubernetes.default.svc`). Images come from GHCR (`:<git-sha>` on dev via `$ARGOCD_APP_REVISION`, `:main` on prod). Do not compile and run Go services as host processes (tests are okay)
  - Chart `values.yaml` is Talos-shaped (GHCR, Istio Gateway, shop-dev/pay-dev). Prod marketplace hosts: `values-prod.yaml`.
  - Browser access is Cloudflare Tunnel → Istio Gateway. The app-of-apps root owns the ambient-enrolled `ecommerce` and `kafka` namespaces; charts render STRICT PeerAuthentication, a service waypoint, and DestinationRules. Proxy retries are opt-in for replay-safe operations only
  - HTML-first web edge using chi, templ, Tailwind CSS, Datastar. Generate templ/Tailwind locally and commit; CI builds images
  - gRPC for internal service-to-service traffic. Prefer devenv `codegen:proto` task (`devenv tasks run codegen:proto`) for protobuf codegen
  - PostgreSQL with goose migrations and sqlc queries. Prefer devenv `codegen:sqlc` task (`devenv tasks run codegen:sqlc`)
  - Keep commit small and frequent
  - GitOps: after `talos-proxmox` platform bring-up, fetch `KUBECONFIG` from Doppler `talos-proxmox/{dev,prod}` and use it to apply `ecommerce/doppler-token`, `infra/argocd/project.yaml`, and `infra/argocd/{dev,prod}/root.yaml`; children retry until platform CRDs exist. Both marketplace roots commit to `main`; dev uses revision SHA images and prod uses `:main`. Do not put Doppler config in Argo values

  Repo conventions:
  - Keep service code under services/<name>/ and private code in internal/
  - Keep SQL and migrations service-local under services/<service>/db/
  - Keep tests under services/<service>/tests/
  - Keep protobuf contracts under shared/proto/<domain>/v1/
  - Keep observability helpers under shared/observe/ (trace, log)
  - Keep shared error helpers under shared/err/ (dberr, grpcerr)
  - Keep docs/ for stable architecture notes, Mermaid diagrams, ADR-style decisions, and service ownership notes
  - Keep application Helm charts and operator-backed custom resources under infra/charts/; do not install shared operators here. Keep the marketplace app-of-apps under infra/argocd/app-of-apps/ with roots under infra/argocd/dev/ and infra/argocd/prod/

  Code style:
  - Don't format the code because I already have a git-hook to autoformat for me.
  - Separate files to logic-related, dont keep in one big file.
  - Don't add tests for everything when implementing, only do so when prompted
  - Do not try to add compatibility code; when possible, remove the legacy and strive for the newest version.

rules:
  proposal:
    - Keep proposals concise and tied to the real repo state
    - Include explicit non-goals when scope can expand
    - Separate change proposals from durable docs
  design:
    - Keep service-local persistence and eventing details with the owning service
    - Capture repo-wide documentation boundaries when relevant
    - Use context7 mcp server to look up documentation if unsure
  tasks:
    - Break work into small, verifiable steps
    - Prefer tasks that map directly to repo structure and service ownership
